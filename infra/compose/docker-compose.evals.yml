# One-off runner for migrate / seed / tests / evals inside Docker, on the dev infra network.
#   docker compose -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.evals.yml \
#     --profile dev run --rm evals            # migrate + seed + live evals
# The image carries the system packages for open-source Unstructured hi_res PDF parsing (poppler, tesseract,
# OpenCV's GL libs); `uv sync --extra layout` adds the Python side (unstructured[pdf], torch CPU).
services:
  evals:
    profiles: [evals]
    image: agentdesk-evals:latest
    build:
      context: .
      dockerfile_inline: |
        FROM ghcr.io/astral-sh/uv:python3.12-bookworm-slim
        RUN apt-get update && apt-get install -y --no-install-recommends               poppler-utils tesseract-ocr libgl1 libglib2.0-0 libmagic1             && rm -rf /var/lib/apt/lists/*
    working_dir: /repo/apps/api
    volumes:
      - ../..:/repo
      - evalvenv:/venv
      - uvcache:/root/.cache/uv
    env_file:
      - path: ../../.env
        required: false
    environment:
      UV_PROJECT_ENVIRONMENT: /venv   # keep the Linux venv out of the host's apps/api/.venv
      UV_LINK_MODE: copy
      HF_HOME: /root/.cache/uv/hf   # layout/table models, cached in the uvcache volume
      PYTHONUTF8: "1"
      DATABASE_URL: postgresql+asyncpg://agentdesk:${POSTGRES_PASSWORD:-agentdesk}@postgres:5432/agentdesk
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ""
      S3_ENDPOINT: http://minio:9000
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      EMBEDDING_API_BASE: http://embeddings:80/v1
      HR_DEMO_DATABASE_URL: postgresql://hr_demo:hr_demo@hr-demo-db:5432/hr_demo
      HR_DEMO_HOST: hr-demo-db
      ALLOW_PRIVATE_ENDPOINTS: "true"
      DEFAULT_LLM_API_BASE: ""
      EVAL_CONCURRENCY: ${EVAL_CONCURRENCY:-4}
    command:
      - bash
      - -c
      - >-
        uv sync --frozen --python 3.12 --extra layout --group evals &&
        uv run alembic upgrade head &&
        uv run python ../../infra/scripts/seed_demo.py &&
        AGENTDESK_LIVE=1 uv run python -m pytest -q tests/evals -s -p no:cacheprovider
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      minio: { condition: service_healthy }
      embeddings: { condition: service_healthy }
      hr-demo-db: { condition: service_healthy }

volumes:
  evalvenv:
  uvcache:
